<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — X-Burger Diner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Righteous&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #C41E3A;
  --red-dark: #9B1830;
  --cream: #FFF8E7;
  --cream-dark: #F5E6C8;
  --dark: #1A1A1A;
  --dark-2: #2A2A2A;
  --dark-3: #333;
  --gold: #D4A017;
  --chrome: #C0C0C0;
  --neon-red: #FF1744;
  --radius: 6px;
  --radius-lg: 12px;
  --transition: 0.25s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--dark);
  color: var(--cream);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }

/* LOGIN */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--dark);
}
.login-box {
  width: 100%;
  max-width: 380px;
  background: var(--dark-2);
  border: 2px solid var(--red);
  border-radius: var(--radius-lg);
  padding: 40px 32px;
  text-align: center;
}
.login-logo {
  font-family: 'Righteous', cursive;
  font-size: 32px;
  color: var(--cream);
  text-shadow: 2px 2px 0 var(--red);
  margin-bottom: 4px;
}
.login-logo span { color: var(--gold); }
.login-box .subtitle {
  font-size: 12px;
  color: var(--chrome);
  margin-bottom: 28px;
  font-weight: 500;
}
.form-group { margin-bottom: 18px; text-align: left; }
.form-group label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--chrome);
  margin-bottom: 6px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 12px 14px;
  background: var(--dark);
  border: 2px solid rgba(196,30,58,0.2);
  border-radius: var(--radius);
  color: var(--cream);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color var(--transition);
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--red); }
.form-group textarea { resize: vertical; min-height: 70px; }
.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: var(--cream);
  border: 2px solid var(--cream);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 4px 4px 0 var(--gold);
  font-family: 'Inter', sans-serif;
  margin-top: 6px;
}
.login-btn:hover { background: var(--red-dark); transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--gold); }

/* ADMIN */
.admin-header {
  background: var(--dark-2);
  border-bottom: 2px solid var(--red);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.admin-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.admin-logo {
  font-family: 'Righteous', cursive;
  font-size: 18px;
  color: var(--cream);
  text-shadow: 1px 1px 0 var(--red);
}
.admin-logo span { color: var(--gold); }
.btn-back {
  color: var(--chrome);
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: color var(--transition);
}
.btn-back:hover { color: var(--red); }
.btn-logout {
  padding: 6px 16px;
  background: transparent;
  border: 1px solid rgba(196,30,58,0.3);
  color: var(--chrome);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  font-family: 'Inter', sans-serif;
}
.btn-logout:hover { border-color: var(--red); color: var(--red); }

.admin-tabs {
  display: flex;
  gap: 4px;
  padding: 12px 16px 0;
  flex-wrap: wrap;
  background: var(--dark-2);
  border-bottom: 1px solid rgba(196,30,58,0.2);
  position: sticky;
  top: 52px;
  z-index: 40;
}
.tab-btn {
  padding: 8px 18px;
  border-radius: var(--radius) var(--radius) 0 0;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  color: var(--chrome);
  transition: all var(--transition);
  font-family: 'Inter', sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tab-btn.active {
  background: var(--dark);
  color: var(--red);
  border-color: rgba(196,30,58,0.2);
}
.tab-btn:not(.active):hover { color: var(--cream); }

.admin-content { padding: 20px 16px; max-width: 800px; margin: 0 auto; }

.card {
  background: var(--dark-2);
  border: 1px solid rgba(196,30,58,0.15);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  padding: 14px 18px;
  background: var(--dark-3);
  border-bottom: 1px solid rgba(196,30,58,0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h3 { font-size: 15px; color: var(--cream); }
.card-body { padding: 18px; }

.prod-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(196,30,58,0.1);
  gap: 12px;
}
.prod-item:last-child { border-bottom: none; }
.prod-info { flex: 1; min-width: 0; }
.prod-name { font-size: 13px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
.prod-desc {
  font-size: 11px;
  color: var(--chrome);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 350px;
}
.prod-price {
  font-family: 'Bebas Neue', cursive;
  font-size: 16px;
  color: var(--gold);
  white-space: nowrap;
  letter-spacing: 1px;
}
.prod-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-icon {
  width: 30px;
  height: 30px;
  border: 1px solid rgba(196,30,58,0.2);
  background: transparent;
  color: var(--chrome);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.btn-icon:hover { border-color: var(--red); color: var(--red); }
.btn-icon.danger:hover { border-color: #dc2626; color: #dc2626; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row .form-group { margin-bottom: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--radius);
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  font-family: 'Inter', sans-serif;
}
.btn-primary { background: var(--red); color: var(--cream); border: 2px solid var(--cream); box-shadow: 3px 3px 0 var(--gold); }
.btn-primary:hover { background: var(--red-dark); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--gold); }
.btn-outline { background: transparent; border: 1px solid rgba(196,30,58,0.3); color: var(--chrome); }
.btn-outline:hover { border-color: var(--red); color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 10px; }

.cat-section {
  background: var(--dark-2);
  border: 1px solid rgba(196,30,58,0.15);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.cat-header {
  padding: 14px 18px;
  background: var(--dark-3);
  border-bottom: 1px solid rgba(196,30,58,0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cat-header h3 { font-size: 15px; color: var(--cream); }
.cat-body { padding: 12px 18px; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--dark-2);
  border: 2px solid var(--red);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 { font-size: 18px; color: var(--cream); margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.img-upload-area {
  border: 1px dashed rgba(196,30,58,0.3);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--dark);
}
.img-upload-area:hover { border-color: var(--red); }
.img-upload-area.has-img { padding: 0; border-style: solid; overflow: hidden; }
.img-upload-area img { width: 100%; max-height: 160px; object-fit: cover; display: block; }
.img-upload-placeholder { color: var(--chrome); font-size: 12px; }
.img-upload-placeholder .upload-icon { font-size: 24px; margin-bottom: 6px; }
.img-upload-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  color: var(--cream); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
}
.img-upload-area:hover .img-upload-overlay { display: flex; }
.img-upload-input { display: none; }

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--red);
  color: var(--cream);
  padding: 10px 22px;
  border: 2px solid var(--cream);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  z-index: 300;
  transform: translateX(120%);
  transition: transform 0.3s ease;
  box-shadow: 3px 3px 0 var(--gold);
}
.toast.show { transform: translateX(0); }

.empty-state { text-align: center; padding: 36px 20px; color: var(--chrome); font-size: 13px; }

@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .prod-desc { max-width: 180px; }
}
</style>
</head>
<body>

<div class="login-wrap" id="loginPage">
  <div class="login-box">
    <div class="login-logo">X<span>Burger</span></div>
    <p class="subtitle">Painel Administrativo</p>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="adminPage" style="display:none">
  <div class="admin-header">
    <div class="admin-header-left">
      <div class="admin-logo">X<span>Burger</span></div>
      <a href="index.html" target="_blank" class="btn-back">Ver Cardápio</a>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>

  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Produtos</button>
    <button class="tab-btn" onclick="switchTab(1)">Categorias</button>
    <button class="tab-btn" onclick="switchTab(2)">Restaurante</button>
    <button class="tab-btn" onclick="switchTab(3)">Config</button>
  </div>

  <div class="admin-content">
    <div id="tab0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="font-size:17px;color:var(--cream)">Produtos</h2>
        <button class="btn btn-primary" onclick="openProdModal()">+ Novo Produto</button>
      </div>
      <div id="prodList"></div>
    </div>
    <div id="tab1" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="font-size:17px;color:var(--cream)">Categorias</h2>
        <button class="btn btn-primary" onclick="openCatModal()">+ Nova Categoria</button>
      </div>
      <div id="catList"></div>
    </div>
    <div id="tab2" style="display:none">
      <div class="card">
        <div class="card-header"><h3>Informações do Restaurante</h3></div>
        <div class="card-body">
          <div class="form-group"><label>Nome</label><input type="text" id="restNome" value="X-Burger"></div>
          <div class="form-row" style="margin-top:12px">
            <div class="form-group"><label>WhatsApp</label><input type="text" id="restWa" value="5535999999999"></div>
            <div class="form-group"><label>Instagram</label><input type="text" id="restIg" value="@xburger"></div>
          </div>
          <div class="form-row" style="margin-top:12px">
            <div class="form-group"><label>Endereço</label><input type="text" id="restEnd" value="Av. Comendador Costa, Centro"></div>
            <div class="form-group"><label>Horário</label><input type="text" id="restHorario" value="Seg a Dom, 11h às 23h"></div>
          </div>
          <div style="margin-top:16px"><button class="btn btn-primary" onclick="saveRest()">Salvar</button></div>
        </div>
      </div>
    </div>
    <div id="tab3" style="display:none">
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><h3>Senha</h3></div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group"><label>Nova Senha</label><input type="password" id="newPass" placeholder="Nova senha"></div>
            <div class="form-group"><label>Confirmar</label><input type="password" id="newPass2" placeholder="Confirmar"></div>
          </div>
          <div style="margin-top:12px"><button class="btn btn-primary" onclick="changePass()">Alterar Senha</button></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Dados</h3></div>
        <div class="card-body">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-outline" onclick="exportData()">Exportar JSON</button>
            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">Importar JSON</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            <button class="btn btn-primary" style="background:#dc2626;border-color:#dc2626;box-shadow:3px 3px 0 #991b1b" onclick="resetData()">Resetar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="prodModal">
  <div class="modal">
    <h2 id="prodModalTitle">Novo Produto</h2>
    <input type="hidden" id="editProdKey" value="">
    <div class="form-group"><label>Categoria</label><select id="prodCat"></select></div>
    <div class="form-group" style="margin-top:12px"><label>Nome</label><input type="text" id="prodNome" placeholder="Ex: X-Uai"></div>
    <div class="form-group" style="margin-top:12px"><label>Descrição</label><textarea id="prodDesc" placeholder="Breve descrição"></textarea></div>
    <div class="form-row" style="margin-top:12px">
      <div class="form-group"><label>Preço (R$)</label><input type="number" id="prodPreco" placeholder="0.00" step="0.01" min="0"></div>
      <div class="form-group"><label>Imagem do Produto</label>
        <div class="img-upload-area" id="imgUploadArea" onclick="document.getElementById('imgUploadInput').click()">
          <div class="img-upload-placeholder" id="imgPlaceholder"><div class="upload-icon">📷</div>Clique para enviar foto</div>
          <img id="imgPreview" style="display:none">
          <div class="img-upload-overlay" id="imgOverlay">Trocar foto</div>
        </div>
        <input type="file" id="imgUploadInput" class="img-upload-input" accept="image/*" onchange="handleImgUpload(event)">
        <input type="hidden" id="prodImg" value="">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeProdModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProd()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal">
  <div class="modal">
    <h2 id="catModalTitle">Nova Categoria</h2>
    <input type="hidden" id="editCatIdx" value="">
    <div class="form-group"><label>Nome</label><input type="text" id="catNome" placeholder="Ex: Burgers"></div>
    <div class="form-group" style="margin-top:12px"><label>Ícone (emoji)</label><input type="text" id="catIcon" placeholder="Ex: 🍔" maxlength="4"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCatModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCat()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DEFAULT_DATA = {
  adminSenha: 'admin123',
  restNome: 'X-Burger', restWa: '5535999999999', restIg: '@xburger',
  restEnd: 'Av. Comendador Costa, Centro, São Lourenço - MG',
  restHorario: 'Seg a Dom, 11h às 23h',
  cats: [
    { nome: 'Burgers Artesanais', icon: '🍔', pratos: [
      { nome: 'X-Uai', desc: 'O mais famoso! Burger 180g, cheddar, bacon, cebola caramelizada, molho especial.', preco: 38.90, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80' },
      { nome: 'Smash Clássico', desc: 'Smash burger 120g, cheddar, pão brioche, picles, molho especial.', preco: 29.90, img: 'https://images.unsplash.com/photo-1530554764233-e79e16c91d08?w=400&q=80' },
      { nome: 'Monster Burger', desc: '3x carne smash, 3x cheddar, bacon, onion rings.', preco: 48.90, img: 'https://images.unsplash.com/photo-1552566626-52f8b828add9?w=400&q=80' },
      { nome: 'X-Veggie', desc: 'Burger vegetariano de grão-de-bico, queijo, rúcula, tomate.', preco: 32.90, img: 'https://images.unsplash.com/photo-1520072959219-c595e6cdc07e?w=400&q=80' }
    ]},
    { nome: 'Smash Burgers', icon: '🔥', pratos: [
      { nome: 'Smash Simples', desc: 'Smash 100g, cheddar, pão brioche, picles.', preco: 24.90, img: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400&q=80' },
      { nome: 'Smash Duplo', desc: '2x smash 100g, 2x cheddar, cebola caramelizada.', preco: 32.90, img: 'https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=400&q=80' }
    ]},
    { nome: 'Acompanhamentos', icon: '🍟', pratos: [
      { nome: 'Batata Frita Especial', desc: 'Batata crocante com sal defumado e páprica.', preco: 18.90, img: 'https://images.unsplash.com/photo-1585109649139-366815a0d713?w=400&q=80' },
      { nome: 'Onion Rings', desc: 'Anéis de cebola empanados e crocantes.', preco: 22.90, img: 'https://images.unsplash.com/photo-1639024471283-03518883512d?w=400&q=80' }
    ]},
    { nome: 'Milk-Shakes', icon: '🥤', pratos: [
      { nome: 'Milk-Shake Nutella', desc: 'O mais pedido! Nutella, sorvete de creme, chantilly. 500ml.', preco: 24.90, img: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=400&q=80' },
      { nome: 'Milk-Shake Ovomaltine', desc: 'Ovomaltine, sorvete de creme, chantilly. 500ml.', preco: 22.90, img: 'https://images.unsplash.com/photo-1579954115545-a95591f28bfc?w=400&q=80' }
    ]},
    { nome: 'Bebidas', icon: '🍺', pratos: [
      { nome: 'Refri Lata', desc: 'Coca-Cola, Guaraná ou Fanta 350ml.', preco: 7.00, img: 'https://images.unsplash.com/photo-1553787434-6e1d49c42e5d?w=400&q=80' },
      { nome: 'Suco Natural', desc: 'Laranja, limão, maracujá ou morango.', preco: 10.00, img: 'https://images.unsplash.com/photo-1622597467836-f3285f2131b8?w=400&q=80' }
    ]},
    { nome: 'Combos', icon: '🎁', pratos: [
      { nome: 'Combo Solo', desc: '1 Burger + Batata + Refri.', preco: 49.90, img: 'https://images.unsplash.com/photo-1662047317263-03ff37e76db2?w=400&q=80' },
      { nome: 'Combo Casal', desc: '2 Burgers + Batata Grande + 2 Refris.', preco: 89.90, img: 'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400&q=80' }
    ]},
    { nome: 'Infantil', icon: '👶', pratos: [
      { nome: 'Mini Burger', desc: 'Burger 100g, cheddar, pão brioche. Acompanha batata pequena.', preco: 22.90, img: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400&q=80' }
    ]}
  ]
};

function loadData() {
  var raw = localStorage.getItem('xburger_admin');
  if (!raw) { localStorage.setItem('xburger_admin', JSON.stringify(DEFAULT_DATA)); return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  try { return JSON.parse(raw); } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveToStorage(data) { localStorage.setItem('xburger_admin', JSON.stringify(data)); }

function doLogin() {
  var data = loadData();
  if (document.getElementById('loginPass').value === data.adminSenha) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    renderAll();
  } else { showToast('Senha incorreta'); }
}
function doLogout() {
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPass').value = '';
}

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){ b.classList.toggle('active', i===idx); });
  for (var i=0; i<4; i++) document.getElementById('tab'+i).style.display = i===idx ? 'block' : 'none';
}

function renderAll() { renderProds(); renderCats(); }

function renderProds() {
  var data = loadData();
  var container = document.getElementById('prodList');
  var html = '';
  for (var c=0; c<data.cats.length; c++) {
    var cat = data.cats[c];
    html += '<div class="cat-section"><div class="cat-header"><h3>'+cat.icon+' '+cat.nome+' ('+cat.prods.length+')</h3></div><div class="cat-body">';
    if (!cat.prods.length) { html += '<div class="empty-state">Nenhum produto</div>'; }
    else {
      for (var p=0; p<cat.prods.length; p++) {
        var pr = cat.prods[p];
        html += '<div class="prod-item"><div class="prod-info"><div class="prod-name">'+pr.nome+'</div><div class="prod-desc">'+pr.desc+'</div></div><div class="prod-price">R$ '+pr.preco.toFixed(2).replace('.',',')+'</div><div class="prod-actions">' +
          '<button class="btn-icon" onclick="editProd('+c+','+p+')">✏️</button>' +
          '<button class="btn-icon danger" onclick="delProd('+c+','+p+')">🗑️</button></div></div>';
      }
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function renderCats() {
  var data = loadData();
  var container = document.getElementById('catList');
  var html = '';
  for (var i=0; i<data.cats.length; i++) {
    html += '<div class="prod-item"><div class="prod-info"><div class="prod-name">'+data.cats[i].icon+' '+data.cats[i].nome+'</div><div class="prod-desc">'+data.cats[i].prods.length+' produto(s)</div></div><div class="prod-actions">' +
      '<button class="btn-icon" onclick="editCat('+i+')">✏️</button>' +
      '<button class="btn-icon danger" onclick="delCat('+i+')">🗑️</button></div></div>';
  }
  container.innerHTML = html || '<div class="empty-state">Nenhuma categoria</div>';
}

function openProdModal() {
  document.getElementById('prodModalTitle').textContent = 'Novo Produto';
  document.getElementById('editProdKey').value = '';
  document.getElementById('prodNome').value = '';
  document.getElementById('prodDesc').value = '';
  document.getElementById('prodPreco').value = '';
  document.getElementById('prodImg').value = '';
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('imgPlaceholder').style.display = 'block';
  document.getElementById('imgUploadArea').classList.remove('has-img');
  var sel = document.getElementById('prodCat');
  sel.innerHTML = '';
  var data = loadData();
  for (var i=0; i<data.cats.length; i++) sel.innerHTML += '<option value="'+i+'">'+data.cats[i].nome+'</option>';
  document.getElementById('prodModal').classList.add('open');
}
function closeProdModal() { document.getElementById('prodModal').classList.remove('open'); }

function editProd(c, p) {
  var data = loadData();
  var pr = data.cats[c].prods[p];
  document.getElementById('prodModalTitle').textContent = 'Editar Produto';
  document.getElementById('editProdKey').value = c+'-'+p;
  document.getElementById('prodNome').value = pr.nome;
  document.getElementById('prodDesc').value = pr.desc;
  document.getElementById('prodPreco').value = pr.preco;
  document.getElementById('prodImg').value = pr.img || '';
  if (pr.img) {
    document.getElementById('imgPreview').src = pr.img;
    document.getElementById('imgPreview').style.display = 'block';
    document.getElementById('imgPlaceholder').style.display = 'none';
    document.getElementById('imgUploadArea').classList.add('has-img');
  } else {
    document.getElementById('imgPreview').style.display = 'none';
    document.getElementById('imgPlaceholder').style.display = 'block';
    document.getElementById('imgUploadArea').classList.remove('has-img');
  }
  var sel = document.getElementById('prodCat');
  sel.innerHTML = '';
  for (var i=0; i<data.cats.length; i++) sel.innerHTML += '<option value="'+i+'"'+(i===c?' selected':'')+'>'+data.cats[i].nome+'</option>';
  document.getElementById('prodModal').classList.add('open');
}

function saveProd() {
  var data = loadData();
  var key = document.getElementById('editProdKey').value;
  var catIdx = parseInt(document.getElementById('prodCat').value);
  var nome = document.getElementById('prodNome').value.trim();
  var desc = document.getElementById('prodDesc').value.trim();
  var preco = parseFloat(document.getElementById('prodPreco').value);
  var img = document.getElementById('prodImg').value.trim();
  if (!nome || isNaN(preco)) { showToast('Preencha nome e preço'); return; }
  var prod = { nome:nome, desc:desc, preco:preco, img:img };
  if (key) {
    var parts = key.split('-');
    var oldC = parseInt(parts[0]), oldP = parseInt(parts[1]);
    if (oldC === catIdx) data.cats[catIdx].prods[oldP] = prod;
    else { data.cats[oldC].prods.splice(oldP,1); data.cats[catIdx].prods.push(prod); }
  } else { data.cats[catIdx].prods.push(prod); }
  saveToStorage(data); closeProdModal(); renderProds(); showToast('Produto salvo!');
}

function delProd(c,p) {
  if (!confirm('Excluir este produto?')) return;
  var data = loadData(); data.cats[c].prods.splice(p,1); saveToStorage(data); renderProds(); showToast('Excluído'); }

function openCatModal() {
  document.getElementById('catModalTitle').textContent = 'Nova Categoria';
  document.getElementById('editCatIdx').value = '';
  document.getElementById('catNome').value = '';
  document.getElementById('catIcon').value = '';
  document.getElementById('catModal').classList.add('open');
}
function closeCatModal() { document.getElementById('catModal').classList.remove('open'); }

function editCat(i) {
  var data = loadData();
  document.getElementById('catModalTitle').textContent = 'Editar Categoria';
  document.getElementById('editCatIdx').value = i;
  document.getElementById('catNome').value = data.cats[i].nome;
  document.getElementById('catIcon').value = data.cats[i].icon;
  document.getElementById('catModal').classList.add('open');
}

function saveCat() {
  var data = loadData();
  var idx = document.getElementById('editCatIdx').value;
  var nome = document.getElementById('catNome').value.trim();
  var icon = document.getElementById('catIcon').value.trim() || '📦';
  if (!nome) { showToast('Digite o nome'); return; }
  if (idx !== '') { data.cats[parseInt(idx)].nome = nome; data.cats[parseInt(idx)].icon = icon; }
  else { data.cats.push({ nome:nome, icon:icon, prods:[] }); }
  saveToStorage(data); closeCatModal(); renderCats(); showToast('Categoria salva!');
}

function delCat(i) {
  if (!confirm('Excluir categoria e todos os produtos?')) return;
  var data = loadData(); data.cats.splice(i,1); saveToStorage(data); renderCats(); renderProds(); showToast('Excluída'); }

function saveRest() {
  var data = loadData();
  data.restNome = document.getElementById('restNome').value.trim();
  data.restWa = document.getElementById('restWa').value.trim();
  data.restIg = document.getElementById('restIg').value.trim();
  data.restEnd = document.getElementById('restEnd').value.trim();
  data.restHorario = document.getElementById('restHorario').value.trim();
  saveToStorage(data); showToast('Informações salvas!');
}

function changePass() {
  var p1 = document.getElementById('newPass').value, p2 = document.getElementById('newPass2').value;
  if (!p1) { showToast('Digite a nova senha'); return; }
  if (p1 !== p2) { showToast('Senhas não conferem'); return; }
  var data = loadData(); data.adminSenha = p1; saveToStorage(data);
  document.getElementById('newPass').value = ''; document.getElementById('newPass2').value = '';
  showToast('Senha alterada!');
}

function exportData() {
  var data = loadData();
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'xburger_backup.json'; a.click();
  showToast('Exportado!');
}

function importData(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try { var d = JSON.parse(ev.target.result); if (d.cats && d.adminSenha) { saveToStorage(d); renderAll(); showToast('Importado!'); } else showToast('Arquivo inválido'); }
    catch(err) { showToast('Erro ao importar'); }
  };
  reader.readAsText(file); e.target.value = '';
}

function resetData() {
  if (!confirm('Resetar TODOS os dados?')) return;
  localStorage.removeItem('xburger_admin'); renderAll(); showToast('Dados resetados');
}

function handleImgUpload(event) {
  var file = event.target.files[0]; if (!file) return;
  if (file.size > 2*1024*1024) { showToast('Imagem muito grande (máx 2MB)'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800, maxH = 600, w = img.width, h = img.height;
      if (w > maxW) { h = h*maxW/w; w = maxW; }
      if (h > maxH) { w = w*maxH/h; h = maxH; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl = canvas.toDataURL('image/jpeg',0.8);
      document.getElementById('prodImg').value = dataUrl;
      document.getElementById('imgPreview').src = dataUrl;
      document.getElementById('imgPreview').style.display = 'block';
      document.getElementById('imgPlaceholder').style.display = 'none';
      document.getElementById('imgUploadArea').classList.add('has-img');
      showToast('Imagem enviada!');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file); event.target.value = '';
}

function showToast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

document.addEventListener('DOMContentLoaded', function() {
  var data = loadData();
  document.getElementById('restNome').value = data.restNome || '';
  document.getElementById('restWa').value = data.restWa || '';
  document.getElementById('restIg').value = data.restIg || '';
  document.getElementById('restEnd').value = data.restEnd || '';
  document.getElementById('restHorario').value = data.restHorario || '';
});
</script>
