<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Papai Bifes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0A0A0A;
  --dark: #111111;
  --dark-2: #1A1A1A;
  --dark-3: #222222;
  --gold: #C4A265;
  --gold-light: #D4B87A;
  --gold-dark: #A68B52;
  --wine: #722F37;
  --wine-light: #8B3A44;
  --cream: #F5F0E8;
  --text: #E0D8CC;
  --text-muted: #8A8078;
  --border: rgba(196,162,101,0.12);
  --border-visible: rgba(196,162,101,0.22);
  --radius: 6px;
  --radius-lg: 12px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', -apple-system, sans-serif;
  background: var(--black);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; }

/* ===== LOGIN ===== */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--black);
}
.login-box {
  width: 100%;
  max-width: 400px;
  background: var(--dark-2);
  border: 1px solid var(--border-visible);
  border-radius: var(--radius-lg);
  padding: 48px 36px;
  text-align: center;
}
.login-logo {
  width: 64px;
  height: 64px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--gold);
  margin: 0 auto 24px;
  line-height: 1;
}
.login-box h1 {
  font-size: 28px;
  color: var(--cream);
  margin-bottom: 6px;
}
.login-box .subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 32px;
  font-weight: 300;
}
.form-group { margin-bottom: 20px; text-align: left; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 14px 16px;
  background: var(--dark);
  border: 1px solid var(--border-visible);
  border-radius: var(--radius);
  color: var(--cream);
  font-size: 14px;
  font-family: 'Outfit', sans-serif;
  outline: none;
  transition: border-color var(--transition);
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--gold);
}
/* ===== IMAGE UPLOAD ===== */
.img-upload-area {
  border: 1px dashed var(--border-visible);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--dark);
  position: relative;
}
.img-upload-area:hover {
  border-color: var(--gold);
  background: rgba(196,162,101,0.03);
}
.img-upload-area.has-img {
  padding: 0;
  border-style: solid;
  overflow: hidden;
}
.img-upload-area img {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  display: block;
}
.img-upload-placeholder {
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 300;
}
.img-upload-placeholder .upload-icon {
  font-size: 28px;
  margin-bottom: 8px;
  color: var(--gold);
  opacity: 0.6;
}
.img-upload-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--cream);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  gap: 8px;
}
.img-upload-area:hover .img-upload-overlay { display: flex; }
.img-upload-input { display: none; }
*
.form-group select option { background: var(--dark); color: var(--cream); }

.login-btn {
  width: 100%;
  padding: 16px;
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: 'Outfit', sans-serif;
  margin-top: 8px;
}
.login-btn:hover { background: var(--gold-light); transform: translateY(-2px); }

/* ===== ADMIN LAYOUT ===== */
.admin-header {
  background: var(--dark-2);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.admin-header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.admin-logo {
  width: 36px;
  height: 36px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}
.admin-header h1 {
  font-size: 20px;
  color: var(--cream);
}
.admin-header h1 span { color: var(--gold); }
.btn-back {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  transition: color var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-back:hover { color: var(--gold); }
.btn-logout {
  padding: 8px 20px;
  background: transparent;
  border: 1px solid var(--border-visible);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  font-family: 'Outfit', sans-serif;
}
.btn-logout:hover { border-color: var(--wine); color: var(--wine); }

/* ===== TABS ===== */
.admin-tabs {
  display: flex;
  gap: 6px;
  padding: 16px 24px 0;
  flex-wrap: wrap;
  background: var(--dark-2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 60px;
  z-index: 40;
}
.tab-btn {
  padding: 10px 22px;
  border-radius: var(--radius) var(--radius) 0 0;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  color: var(--text-muted);
  transition: all var(--transition);
  font-family: 'Outfit', sans-serif;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.tab-btn.active {
  background: var(--dark);
  color: var(--gold);
  border-color: var(--border);
}
.tab-btn:not(.active):hover { color: var(--cream); }

/* ===== CONTENT ===== */
.admin-content {
  padding: 24px;
  max-width: 900px;
  margin: 0 auto;
}

/* ===== CARDS ===== */
.card {
  background: var(--dark-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  overflow: hidden;
}
.card-header {
  padding: 18px 24px;
  background: var(--dark-3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h3 {
  font-size: 16px;
  color: var(--cream);
  font-weight: 600;
}
.card-body { padding: 24px; }

/* ===== PRODUCT LIST ===== */
.prod-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.prod-item:last-child { border-bottom: none; }
.prod-info { flex: 1; min-width: 0; }
.prod-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--cream);
  margin-bottom: 2px;
}
.prod-desc {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 300;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 400px;
}
.prod-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--gold);
  font-weight: 700;
  white-space: nowrap;
}
.prod-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.btn-icon {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-visible);
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.btn-icon:hover { border-color: var(--gold); color: var(--gold); }
.btn-icon.danger:hover { border-color: var(--wine); color: var(--wine); }

/* ===== FORM ROWS ===== */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-row .form-group { margin-bottom: 0; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-radius: var(--radius);
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  font-family: 'Outfit', sans-serif;
}
.btn-primary { background: var(--gold); color: var(--black); }
.btn-primary:hover { background: var(--gold-light); }
.btn-wine { background: var(--wine); color: var(--cream); }
.btn-wine:hover { background: var(--wine-light); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border-visible);
  color: var(--text-muted);
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-sm { padding: 8px 16px; font-size: 11px; }

/* ===== CATEGORY SECTION ===== */
.cat-section {
  background: var(--dark-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  overflow: hidden;
}
.cat-header {
  padding: 18px 24px;
  background: var(--dark-3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cat-header h3 {
  font-size: 16px;
  color: var(--cream);
  font-weight: 600;
}
.cat-body { padding: 16px 24px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--dark-2);
  border: 1px solid var(--border-visible);
  border-radius: var(--radius-lg);
  padding: 36px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 22px;
  color: var(--cream);
  margin-bottom: 24px;
}
.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 24px;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 32px;
  right: 32px;
  background: var(--dark-2);
  color: var(--cream);
  padding: 14px 28px;
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  z-index: 300;
  transform: translateX(120%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.show { transform: translateX(0); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 300;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .admin-header { padding: 14px 16px; }
  .admin-content { padding: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .prod-desc { max-width: 200px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginPage">
  <div class="login-box">
    <div class="login-logo">P</div>
    <h1>Papai <em style="font-style:italic;font-weight:300;color:var(--gold)">Bifes</em></h1>
    <p class="subtitle">Painel Administrativo</p>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="Digite a senha de acesso" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPage" style="display:none">
  <div class="admin-header">
    <div class="admin-header-left">
      <div class="admin-logo">P</div>
      <h1>Papai <span>Bifes</span> — Admin</h1>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="index.html" target="_blank" class="btn-back">Ver Cardápio</a>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Produtos</button>
    <button class="tab-btn" onclick="switchTab(1)">Categorias</button>
    <button class="tab-btn" onclick="switchTab(2)">Restaurante</button>
    <button class="tab-btn" onclick="switchTab(3)">Configurações</button>
  </div>

  <div class="admin-content">
    <!-- TAB: PRODUTOS -->
    <div id="tab0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:20px;color:var(--cream)">Produtos por Categoria</h2>
        <button class="btn btn-primary" onclick="openProdModal()">+ Novo Produto</button>
      </div>
      <div id="prodList"></div>
    </div>

    <!-- TAB: CATEGORIAS -->
    <div id="tab1" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:20px;color:var(--cream)">Categorias</h2>
        <button class="btn btn-primary" onclick="openCatModal()">+ Nova Categoria</button>
      </div>
      <div id="catList"></div>
    </div>

    <!-- TAB: RESTAURANTE -->
    <div id="tab2" style="display:none">
      <div class="card">
        <div class="card-header"><h3>Informações do Restaurante</h3></div>
        <div class="card-body">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" id="restNome" value="Papai Bifes">
          </div>
          <div class="form-row" style="margin-top:16px">
            <div class="form-group">
              <label>Telefone / WhatsApp</label>
              <input type="text" id="restTel" value="(35) 3331-2899">
            </div>
            <div class="form-group">
              <label>Endereço</label>
              <input type="text" id="restEnd" value="R. Wenceslau Braz, 71 - Centro">
            </div>
          </div>
          <div class="form-row" style="margin-top:16px">
            <div class="form-group">
              <label>Horário</label>
              <input type="text" id="restHorario" value="Seg a Dom, 11h às 23h">
            </div>
            <div class="form-group">
              <label>WhatsApp Link</label>
              <input type="text" id="restWa" value="55353312899">
            </div>
          </div>
          <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="saveRest()">Salvar Informações</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: CONFIGURAÇÕES -->
    <div id="tab3" style="display:none">
      <div class="card" style="margin-bottom:20px">
        <div class="card-header"><h3>Senha do Admin</h3></div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label>Nova Senha</label>
              <input type="password" id="newPass" placeholder="Nova senha">
            </div>
            <div class="form-group">
              <label>Confirmar</label>
              <input type="password" id="newPass2" placeholder="Confirmar senha">
            </div>
          </div>
          <div style="margin-top:16px">
            <button class="btn btn-primary" onclick="changePass()">Alterar Senha</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Dados</h3></div>
        <div class="card-body">
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn-outline" onclick="exportData()">Exportar JSON</button>
            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">Importar JSON</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            <button class="btn btn-wine" onclick="resetData()">Resetar Dados</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: PRODUTO -->
<div class="modal-overlay" id="prodModal">
  <div class="modal">
    <h2 id="prodModalTitle">Novo Produto</h2>
    <input type="hidden" id="editProdKey" value="">
    <div class="form-group">
      <label>Categoria</label>
      <select id="prodCat"></select>
    </div>
    <div class="form-group" style="margin-top:16px">
      <label>Nome do Produto</label>
      <input type="text" id="prodNome" placeholder="Ex: Picanha Fininha">
    </div>
    <div class="form-group" style="margin-top:16px">
      <label>Descrição</label>
      <textarea id="prodDesc" placeholder="Breve descrição do prato"></textarea>
    </div>
    <div class="form-row" style="margin-top:16px">
      <div class="form-group">
        <label>Preço (R$)</label>
        <input type="number" id="prodPreco" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Imagem do Produto</label>
        <div class="img-upload-area" id="imgUploadArea" onclick="document.getElementById('imgUploadInput').click()">
          <div class="img-upload-placeholder" id="imgPlaceholder">
            <div class="upload-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            Clique para enviar uma foto
          </div>
          <img id="imgPreview" style="display:none">
          <div class="img-upload-overlay" id="imgOverlay">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Trocar foto
          </div>
        </div>
        <input type="file" id="imgUploadInput" class="img-upload-input" accept="image/*" onchange="handleImgUpload(event)">
        <input type="hidden" id="prodImg" value="">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeProdModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProd()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: CATEGORIA -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <h2 id="catModalTitle">Nova Categoria</h2>
    <input type="hidden" id="editCatIdx" value="">
    <div class="form-group">
      <label>Nome da Categoria</label>
      <input type="text" id="catNome" placeholder="Ex: Entradas">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCatModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCat()">Salvar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== DEFAULT DATA =====
var DEFAULT_DATA = {
  adminSenha: "admin123",
  restNome: "Papai Bifes",
  restTel: "(35) 3331-2899",
  restEnd: "R. Wenceslau Braz, 71 - Centro, São Lourenço - MG",
  restHorario: "Seg a Dom, 11h às 23h",
  restWa: "55353312899",
  cats: [
    {
      nome: "Entradas",
      prods: [

// ===== LOAD DATA =====
function loadData() {
  var raw = localStorage.getItem('papaibifes_admin');
  if (!raw) {
    localStorage.setItem('papaibifes_admin', JSON.stringify(DEFAULT_DATA));
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  try { return JSON.parse(raw); } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveToStorage(data) {
  localStorage.setItem('papaibifes_admin', JSON.stringify(data));
}

// ===== LOGIN =====
function doLogin() {
  var data = loadData();
  var pass = document.getElementById('loginPass').value;
  if (pass === data.adminSenha) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    renderAll();
  } else {
    showToast('Senha incorreta');
  }
}
function doLogout() {
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPass').value = '';
}

// ===== TABS =====
function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){ b.classList.toggle('active', i===idx); });
  for (var i=0; i<4; i++) {
    document.getElementById('tab'+i).style.display = i===idx ? 'block' : 'none';
  }
}

// ===== RENDER =====
function renderAll() { renderProds(); renderCats(); }
function renderProds() {
  var data = loadData();
  var container = document.getElementById('prodList');
  var html = '';
  for (var c=0; c<data.cats.length; c++) {
    var cat = data.cats[c];
    html += '<div class="cat-section"><div class="cat-header"><h3>' + cat.nome + ' (' + cat.prods.length + ')</h3></div><div class="cat-body">';
    if (cat.prods.length === 0) {
      html += '<div class="empty-state">Nenhum produto nesta categoria</div>';
    } else {
      for (var p=0; p<cat.prods.length; p++) {
        var pr = cat.prods[p];
        html += '<div class="prod-item"><div class="prod-info"><div class="prod-name">' + pr.nome + '</div><div class="prod-desc">' + pr.desc + '</div></div><div class="prod-price">R$ ' + pr.preco.toFixed(2).replace('.',',') + '</div><div class="prod-actions">' +
          '<button class="btn-icon" onclick="editProd(' + c + ',' + p + ')" title="Editar">✏️</button>' +
          '<button class="btn-icon danger" onclick="delProd(' + c + ',' + p + ')" title="Excluir">🗑️</button>' +
          '</div></div>';
      }
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}
function renderCats() {
  var data = loadData();
  var container = document.getElementById('catList');
  var html = '';
  for (var i=0; i<data.cats.length; i++) {
    html += '<div class="prod-item"><div class="prod-info"><div class="prod-name">' + data.cats[i].nome + '</div><div class="prod-desc">' + data.cats[i].prods.length + ' produto(s)</div></div><div class="prod-actions">' +
      '<button class="btn-icon" onclick="editCat(' + i + ')">✏️</button>' +
      '<button class="btn-icon danger" onclick="delCat(' + i + ')">🗑️</button>' +
      '</div></div>';
  }
  container.innerHTML = html || '<div class="empty-state">Nenhuma categoria</div>';
}

// ===== PRODUCT MODAL =====
function openProdModal() {
  document.getElementById('prodModalTitle').textContent = 'Novo Produto';
  document.getElementById('editProdKey').value = '';
  document.getElementById('prodNome').value = '';
  document.getElementById('prodDesc').value = '';
  document.getElementById('prodPreco').value = '';
  document.getElementById('prodImg').value = '';
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('imgPreview').src = '';
  document.getElementById('imgPlaceholder').style.display = 'block';
  document.getElementById('imgUploadArea').classList.remove('has-img');
  document.getElementById('imgOverlay').style.display = 'none';
  var sel = document.getElementById('prodCat');
  sel.innerHTML = '';
  var data = loadData();
  for (var i=0; i<data.cats.length; i++) {
    sel.innerHTML += '<option value="' + i + '">' + data.cats[i].nome + '</option>';
  }
  document.getElementById('prodModal').classList.add('open');
}
function closeProdModal() { document.getElementById('prodModal').classList.remove('open'); }
function editProd(c, p) {
  var data = loadData();
  var pr = data.cats[c].prods[p];
  document.getElementById('prodModalTitle').textContent = 'Editar Produto';
  document.getElementById('editProdKey').value = c + '-' + p;
  document.getElementById('prodNome').value = pr.nome;
  document.getElementById('prodDesc').value = pr.desc;
  document.getElementById('prodPreco').value = pr.preco;
  document.getElementById('prodImg').value = pr.img || '';
  if (pr.img && pr.img.startsWith('data:') || pr.img && pr.img.startsWith('http')) {
    document.getElementById('imgPreview').src = pr.img;
    document.getElementById('imgPreview').style.display = 'block';
    document.getElementById('imgPlaceholder').style.display = 'none';
    document.getElementById('imgUploadArea').classList.add('has-img');
    document.getElementById('imgOverlay').style.display = 'flex';
  } else {
    document.getElementById('imgPreview').style.display = 'none';
    document.getElementById('imgPreview').src = '';
    document.getElementById('imgPlaceholder').style.display = 'block';
    document.getElementById('imgUploadArea').classList.remove('has-img');
    document.getElementById('imgOverlay').style.display = 'none';
  }
  var sel = document.getElementById('prodCat');
  sel.innerHTML = '';
  for (var i=0; i<data.cats.length; i++) {
    sel.innerHTML += '<option value="' + i + '"' + (i===c?' selected':'') + '>' + data.cats[i].nome + '</option>';
  }
  document.getElementById('prodModal').classList.add('open');
}
function saveProd() {
  var data = loadData();
  var key = document.getElementById('editProdKey').value;
  var catIdx = parseInt(document.getElementById('prodCat').value);
  var nome = document.getElementById('prodNome').value.trim();
  var desc = document.getElementById('prodDesc').value.trim();
  var preco = parseFloat(document.getElementById('prodPreco').value);
  var img = document.getElementById('prodImg').value.trim();
  if (!nome || isNaN(preco)) { showToast('Preencha nome e preço'); return; }
  var prod = { nome: nome, desc: desc, preco: preco, img: img };
  if (key) {
    var parts = key.split('-');
    var oldC = parseInt(parts[0]), oldP = parseInt(parts[1]);
    if (oldC === catIdx) { data.cats[catIdx].prods[oldP] = prod; }
    else { data.cats[oldC].prods.splice(oldP, 1); data.cats[catIdx].prods.push(prod); }
  } else {
    data.cats[catIdx].prods.push(prod);
  }
  saveToStorage(data);
  closeProdModal();
  renderProds();
  showToast('Produto salvo!');
}
function delProd(c, p) {
  if (!confirm('Excluir este produto?')) return;
  var data = loadData();
  data.cats[c].prods.splice(p, 1);
  saveToStorage(data);
  renderProds();
  showToast('Produto excluído');
}

// ===== CATEGORY MODAL =====
function openCatModal() {
  document.getElementById('catModalTitle').textContent = 'Nova Categoria';
  document.getElementById('editCatIdx').value = '';
  document.getElementById('catNome').value = '';
  document.getElementById('catModal').classList.add('open');
}
function closeCatModal() { document.getElementById('catModal').classList.remove('open'); }
function editCat(i) {
  var data = loadData();
  document.getElementById('catModalTitle').textContent = 'Editar Categoria';
  document.getElementById('editCatIdx').value = i;
  document.getElementById('catNome').value = data.cats[i].nome;
  document.getElementById('catModal').classList.add('open');
}
function saveCat() {
  var data = loadData();
  var idx = document.getElementById('editCatIdx').value;
  var nome = document.getElementById('catNome').value.trim();
  if (!nome) { showToast('Digite o nome'); return; }
  if (idx !== '') { data.cats[parseInt(idx)].nome = nome; }
  else { data.cats.push({ nome: nome, prods: [] }); }
  saveToStorage(data);
  closeCatModal();
  renderCats();
  showToast('Categoria salva!');
}
function delCat(i) {
  if (!confirm('Excluir categoria e todos os produtos?')) return;
  var data = loadData();
  data.cats.splice(i, 1);
  saveToStorage(data);
  renderCats();
  renderProds();
  showToast('Categoria excluída');
}

// ===== CONFIG =====
function changePass() {
  var p1 = document.getElementById('newPass').value;
  var p2 = document.getElementById('newPass2').value;
  if (!p1) { showToast('Digite a nova senha'); return; }
  if (p1 !== p2) { showToast('Senhas não conferem'); return; }
  var data = loadData();
  data.adminSenha = p1;
  saveToStorage(data);
  document.getElementById('newPass').value = '';
  document.getElementById('newPass2').value = '';
  showToast('Senha alterada!');
}
function exportData() {
  var data = loadData();
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'papaibifes_backup.json';
  a.click();
  showToast('Exportado!');
}
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.cats && data.adminSenha) {
        saveToStorage(data);
        renderAll();
        showToast('Importado com sucesso!');
      } else { showToast('Arquivo inválido'); }
    } catch(err) { showToast('Erro ao importar'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function resetData() {
  if (!confirm('Resetar TODOS os dados? Isso não pode ser desfeito.')) return;
  localStorage.removeItem('papaibifes_admin');
  renderAll();
  showToast('Dados resetados');
}

// ===== IMAGE UPLOAD =====
function handleImgUpload(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('Imagem muito grande (máx 2MB)'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800, maxH = 600;
      var w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('prodImg').value = dataUrl;
      document.getElementById('imgPreview').src = dataUrl;
      document.getElementById('imgPreview').style.display = 'block';
      document.getElementById('imgPlaceholder').style.display = 'none';
      document.getElementById('imgUploadArea').classList.add('has-img');
      document.getElementById('imgOverlay').style.display = 'flex';
      showToast('Imagem enviada!');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

// ===== TOAST =====
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
